[package]
name = "dekopon-exa-search-provider"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dekopon-agents/dekopon-provider-exa-search"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dekopon-provider-http = "=0.18.0"
dekopon-provider-sdk = { version = "=0.18.0", features = ["clap"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
time = { version = "=0.3.55", features = ["parsing"] }
wit-bindgen = { version = "=0.62.0", default-features = false, features = ["macros", "realloc"] }

[dev-dependencies]
dekopon-provider-sdk-testkit = "=0.18.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = "symbols"
